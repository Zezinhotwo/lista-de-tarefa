<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Execulte</title>
  <link rel="stylesheet" href="style/style.css" />
<script defer src="runtimebundle.js"></script><script defer src="mainbundle.js"></script></head>

<body class="corpo">
  <!-- FORM -->
  <form action="#" class="form hide">
    <div class="formulario">
      <button type="button" id="addTask" class="exit-form">X</button>
      <label for="nome">Nome</label>
      <input type="text" name="nome" id="nome" placeholder="Zezinhotwo" required />

      <div>
        <label>Nível</label>
        <input type="radio" id="radio1" name="nivel" value="1" required />
        <label for="radio1" class="level"></label>

        <input type="radio" id="radio2" name="nivel" value="2" required />
        <label for="radio2" class="level2"></label>

        <input type="radio" id="radio3" name="nivel" value="3" required />
        <label for="radio3" class="level3"></label>

        <input type="radio" id="radio4" name="nivel" value="4" required />
        <label for="radio4" class="level4"></label>
      </div>
      <label for="dias">Prazo (dias)</label>
      <input type="number" name="prazo" id="dias" placeholder="5" required />

      <label for="descricao">Descrição</label>
      <textarea name="descricao" id="descricao" rows="10" cols="30" placeholder="going to run" required></textarea>
      <button type="submit" class="bnt-submit">Enviar</button>
    </div>
  </form>

  <!-- HEADER -->
  <header class="cabeca">
    <nav class="navegacao">
      <ul class="nav">
        <span class="item-nav"> <img class="add-icon" src="" alt="">Adicionar Tarefa</span>
        <li class="item-nav"><img class="today-icon" src="" alt="">Hoje</li>
        <li class="item-nav"><img class="all-icon" src="" alt="">All Task</li>
        <li class="item-nav"><img class="check-icon" src="" alt="">Feitas</li>
        <li class="item-nav"><img class="yesterDay-icon" src="" alt="">Ontem</li>
      </ul>
      <br />
      <br />
      <ul>
        <li>Meus projetos</li>
      </ul>
      <span>
        <a href="https://github.com/Zezinhotwo?tab=overview&from=2024-08-01&to=2024-08-01"
          target="_blank">&copy;&nbsp;Zezinhotwo</a>
      </span>
    </nav>
  </header>
  <!--END HEADER -->

  <!-- Content -->
  <section class="content">
    <h2>Hoje</h2>
    <div>
      <p>Meus Projetos</p>
    </div>
    <div class="listTask">
      <!-- <details id="task-container"></details>  -->
    </div>
    <button class="addTask adicionarTarrefa">Adicionar Tarefa</button>
  </section>
  <!-- END Content -->


</body>

</html>
